# LearnFRC for iPhone, iPad and Mac: one SwiftUI app plus a widget extension,
# generated into LearnFRC.xcodeproj with XcodeGen (`xcodegen generate` in this
# folder). Sources are Xcode synced folders, so files added under LearnFRC/,
# LearnFRCWidgets/ or Shared/ show up in Xcode on their own.
# Architecture and the website contract: docs/ARCHITECTURE.md.
name: LearnFRC
options:
  bundleIdPrefix: com.learnfrc
  # Built with Xcode 27.1 (the iOS 27.1 SDK, which the iPhone Duo needs to run the app
  # natively rather than in compatibility mode). The app still runs on iOS 26 and macOS 26:
  # every 27.1 API is behind `if #available(iOS 27.1, *)`, and behind `#if os(iOS)` while
  # the macOS SDK is 27.0 (Design/Fold.swift).
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Jahaan's free Personal Team, for installing on his own devices from Xcode.
    DEVELOPMENT_TEAM: X9QP4MF9YR
    CODE_SIGN_STYLE: Automatic
    # Until a development team is set, Mac builds are signed ad hoc ("Sign to Run Locally").
    "CODE_SIGN_STYLE[sdk=macosx*]": Manual
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.6.0
  YouTubePlayerKit:
    url: https://github.com/SvenTiigi/YouTubePlayerKit
    from: 2.0.0
targets:
  LearnFRC:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: LearnFRC
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Markdown
        product: Markdown
      - package: YouTubePlayerKit
        product: YouTubePlayerKit
      - target: LearnFRCWidgets
    # App Review 4.8 and 2.1: an App Store build that offers Google must offer Sign in with
    # Apple too, and its button must work. Two switches have to move together for that
    # (LF_APPLE_SIGN_IN below, and dropping the two CODE_SIGN_ENTITLEMENTS overrides that
    # leave the Apple entitlement out), so archives (ACTION=install) refuse to build with
    # either one forgotten. Debug runs and Personal Team installs aren't archives and are
    # untouched.
    preBuildScripts:
      - name: Check Sign in with Apple for App Store builds
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/$(CODE_SIGN_ENTITLEMENTS)
        script: |
          if [ "$ACTION" = "install" ]; then
            if [ "$LF_APPLE_SIGN_IN" != "YES" ]; then
              echo "error: LF_APPLE_SIGN_IN is NO but Google sign-in is offered (App Review 4.8). Set it to YES in project.yml for an App Store build."
              exit 1
            fi
            if ! /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin" "$SRCROOT/$CODE_SIGN_ENTITLEMENTS" >/dev/null 2>&1; then
              echo "error: $CODE_SIGN_ENTITLEMENTS has no Sign in with Apple entitlement. Drop the Personal Team and local Mac CODE_SIGN_ENTITLEMENTS overrides in project.yml."
              exit 1
            fi
          fi
    entitlements:
      path: LearnFRC/LearnFRC.entitlements
      properties:
        com.apple.security.application-groups: [group.com.learnfrc.app]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # Sign in with Apple (docs/ARCHITECTURE.md 6.1). Only a paid team can sign it, so the
        # Personal Team device build and the teamless Mac build use the override files below,
        # which leave it out; with a paid team those overrides go and this file is used.
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnfrc.app
        PRODUCT_NAME: LearnFRC
        # Sign in with Apple's button (AppConfig.isAppleSignInEnabled, read from Info.plist's
        # LFAppleSignIn). NO until the paid team, the capability on the App ID and Supabase's
        # Apple provider are set up; then YES.
        LF_APPLE_SIGN_IN: "NO"
        # No team yet: Mac builds sign locally without the app group (see the file).
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": LearnFRC/LearnFRC-macOS-local.entitlements
        # Free Personal Team: device builds can't use App Groups (see the file). Remove with a paid team.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": LearnFRC/LearnFRC-iOS-personal.entitlements
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LearnFRC
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Upside down too, for iPhones that turn that way (Touch ID ones, like iPhone Duo; Face
        # ID iPhones ignore it). In the iOS 27.1 simulator a Duo folded while upside down still
        # leaves its cover in landscape, for any app (a test app declaring all four did the
        # same), so that part is the system's call.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save your LearnFRC certificate to Photos."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: LearnFRC/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.learnfrc.app
            CFBundleURLSchemes: [learnfrc]
        ITSAppUsesNonExemptEncryption: false
        # Handoff and Siri suggestions for the lesson on screen (LessonView's NSUserActivity,
        # continued by AppModel.handle(userActivity:)). Xcode doesn't generate this key from a
        # build setting, so it lives here.
        NSUserActivityTypes:
          - com.learnfrc.app.lesson
        # The LF_APPLE_SIGN_IN build setting, for AppConfig.isAppleSignInEnabled.
        LFAppleSignIn: $(LF_APPLE_SIGN_IN)
        # Lets debug runs talk to `next dev` on localhost (-LFAPIBase http://localhost:3000).
        # Local network only; every real request goes to https://learnfrc.com.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  LearnFRCWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: LearnFRCWidgets
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    entitlements:
      path: LearnFRCWidgets/LearnFRCWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.learnfrc.app]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnfrc.app.widgets
        PRODUCT_NAME: LearnFRCWidgets
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": LearnFRCWidgets/LearnFRCWidgets-macOS-local.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": LearnFRCWidgets/LearnFRCWidgets-iOS-personal.entitlements
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LearnFRC
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: LearnFRCWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # The widget registers the app's bundled fonts this way (an extension can't run the
        # app's FontRegistry). Keep in step with LearnFRCWidgets/Fonts.
        UIAppFonts:
          - LFBricolageDisplay-S.ttf
          - LFBricolageDisplay-M.ttf
          - LFBricolage-Regular.ttf
          - LFBricolage-SemiBold.ttf
          - LFSpaceMono-Regular.ttf
          - LFSpaceMono-Bold.ttf
          - LFCaveat-SemiBold.ttf
        ATSApplicationFontsPath: "."
